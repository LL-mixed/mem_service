listen=unix:/tmp/linqu_mem_service.sock
store=/tmp/linqu_mem_service.store
node_id=local-node-0
cluster_id=local-cluster
storage_root=/tmp/linqu_mem_service
backend=snapshot+journal
max_records=1024
max_payload_bytes=4096
retention=manual
checkpoint_retention=manual
record_retention=manual
encryption=none
auth_mode=none
metrics_mode=text-kv
metrics_listen=tcp:127.0.0.1:9900
adapter_enablement=core

# Trusted guest network example (isolated guest networks only; no TLS or
# cryptographic peer authentication). Requires an exact tcp listen endpoint,
# this node's stable node_id and a non-empty network_peer allowlist mapping
# node IDs one-to-one to exact guest IPv4 addresses.
# listen=tcp:192.168.100.11:9700
# auth_mode=trusted-guest-network
# node_id=guest-node-0
# network_peer=guest-node-0@192.168.100.11
# network_peer=guest-node-1@192.168.100.12
# network_io_timeout_ms=3000
